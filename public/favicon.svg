<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#primary)" opacity="0.35" filter="url(#glow)" />
  
  <!-- Dynamic Ring Donut Segments (Representing 50/30/20) -->
  <circle cx="256" cy="256" r="160" stroke="#3b82f6" stroke-width="28" stroke-dasharray="502 502" stroke-dashoffset="0" stroke-linecap="round" opacity="0.9" />
  <circle cx="256" cy="256" r="160" stroke="#8b5cf6" stroke-width="28" stroke-dasharray="301 703" stroke-dashoffset="-520" stroke-linecap="round" opacity="0.9" />
  <circle cx="256" cy="256" r="160" stroke="#14b8a6" stroke-width="28" stroke-dasharray="201 803" stroke-dashoffset="-840" stroke-linecap="round" opacity="0.95" />

  <!-- Center Stylized 'ai' & Sparkle -->
  <g transform="translate(156, 156)">
    <!-- Main A & Diamond Path -->
    <path d="M100 30 L170 170 L130 170 L115 136 L85 136 L70 170 L30 170 Z M100 78 L90 106 L110 106 Z" fill="url(#accent)" />
    <!-- AI Sparkle -->
    <path d="M165 40 Q175 60 195 70 Q175 80 165 100 Q155 80 135 70 Q155 60 165 40 Z" fill="#60a5fa" filter="url(#glow)" opacity="0.9" />
  </g>
</svg>
