    <title>aiBudget - Finance & Lifestyle</title>

    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('aibudget_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            metas.forEach(function(m) { m.setAttribute('content', '#ffffff'); });
          } else if (savedTheme === 'dark') {
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            metas.forEach(function(m) { m.setAttribute('content', '#09090b'); });
          }
          localStorage.removeItem('aibudget_font');
          document.documentElement.style.removeProperty('--font-sans');
        } catch (e) {}
      })();
    </script>
